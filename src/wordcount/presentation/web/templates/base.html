<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WordCount Pro - Industrial text metrics, keyword density, and readability analyzer.">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="container header-container">
            <div class="brand">
                <span class="brand-icon">⚡</span>
                <div class="brand-text">
                    <h1>{{ app_name }}</h1>
                    <span class="brand-tag">v{{ version }} • Keystone Architecture</span>
                </div>
            </div>
            <div class="header-actions">
                <a href="/docs" target="_blank" class="btn btn-secondary btn-sm" title="OpenAPI Documentation">API Docs</a>
                <button id="themeToggle" class="btn btn-icon" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
                    <span id="themeIcon">☀️</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="app-footer">
        <div class="container footer-container">
            <p>© 2026 WordCount Pro • Clean Architecture with Keystone Principles • Production Grade</p>
        </div>
    </footer>

    <script src="/static/js/app.js"></script>
</body>
</html>

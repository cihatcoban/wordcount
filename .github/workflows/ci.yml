name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Quality & Linting
        run: |
          ruff check src/ tests/

      - name: Type Checking
        run: |
          mypy src/

      - name: Run Unit & Integration Tests
        run: |
          PYTHONPATH=src pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Run E2E CLI Check
        run: |
          PYTHONPATH=src python -m wordcount.presentation.cli "Automated CI verification test." --json

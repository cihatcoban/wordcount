[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordcount-pro"
version = "2.0.0"
description = "Enterprise Text Analysis & Linguistic Metrics Engine built on Keystone Clean Architecture"
readme = "README.md"
authors = [
    { name = "Senior Software Engineer" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.3.0",
]

[project.scripts]
wordcount = "wordcount.presentation.cli:main"
wordcount-server = "wordcount.__main__:run_server"

[tool.hatch.build.targets.wheel]
packages = ["src/wordcount"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
